<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Alarms and Curiosity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e8f5e9;
            font-family: 'Georgia', 'Garamond', serif;
            line-height: 1.6;
            color: #333;
        }


        header {
            padding: 20px 20px;
        }

        .header-top {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0;
        }

        nav {
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.1em;
            transition: background-color 0.3s ease, color 0.3s ease;
            border: 2px solid transparent;
        }

        nav a:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        nav a.active {
            background-color: rgba(0, 0, 0, 0.15);
            border: 2px solid #333;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .post-header {
            margin-bottom: 40px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .post-date {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .post-content {
            font-size: 1.1em;
            line-height: 1.8;
        }

        .post-content p {
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #666;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            margin-top: 60px;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            color: #333;
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="../../">About</a>
            <a href="../" class="active">Blog</a>
        </nav>
    </header>

    <main>
        <div class="post-header">
            <div class="post-date">November 16, 2024</div>
        </div>

        <article class="post-content">
            TODO
        </article>

        <a href="../" class="back-link">← Back to Blog</a>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://linkedin.com/in/naomibas" target="_blank">LinkedIn</a>
            <a href="https://x.com/NaomiBashkansky" target="_blank">X (Twitter)</a>
            <a href="mailto:nomichka@gmail.com">Email</a>
        </div>
    </footer>
</body>
</html>
