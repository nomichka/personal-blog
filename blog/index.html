<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e8f5e9;
            font-family: 'Georgia', 'Garamond', serif;
            line-height: 1.6;
            color: #333;
        }


        header {
            padding: 20px 20px;
            border-bottom: 2px solid #e5e7eb;
        }

        .header-top {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0;
        }

        nav {
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.1em;
            transition: background-color 0.3s ease, color 0.3s ease;
            border: 2px solid transparent;
        }

        nav a:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        nav a.active {
            background-color: rgba(0, 0, 0, 0.15);
            border: 2px solid #333;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .blog-post-link {
            display: block;
            border: 1px solid #eee;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 5px;
            transition: box-shadow 0.3s ease;
            text-decoration: none;
            color: #333;
            cursor: pointer;
        }

        .blog-post-link:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .blog-post-link h2 {
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .blog-post-date {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .blog-post-link p {
            margin-bottom: 0;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            border-top: 2px solid #e5e7eb;
            margin-top: 60px;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            color: #333;
            text-decoration: none;
            margin: 0 15px;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>Naomi</h1>
        </div>
        <nav>
            <a href="../index.html">About</a>
            <a href="index.html" class="active">Blog</a>
        </nav>
    </header>

    <main>
        <a href="fire-alarms/index.html" class="blog-post-link">
            <h2>Fire Alarms and Curiosity</h2>
            <div class="blog-post-date">November 16, 2024</div>
            <p>
                The remnants of an aerosolized spray hang in the air and mingle with embarrassed amusement, a brief aurora of human error.
            </p>
        </a>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://linkedin.com/in/naomibas" target="_blank">LinkedIn</a>
            <a href="https://x.com/NaomiBashkansky" target="_blank">X (Twitter)</a>
            <a href="mailto:nomichka@gmail.com">Email</a>
        </div>
    </footer>
</body>
</html>
